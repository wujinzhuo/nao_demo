services:
    postgres:
        image: postgres:16-alpine
        container_name: nao_chat_postgres
        security_opt:
            - label:disable
            - seccomp:unconfined
        env_file:
            - .env
        environment:
            POSTGRES_USER: ${POSTGRES_USER:-nao}
            POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-nao}
            POSTGRES_DB: ${POSTGRES_DB:-nao}
        ports:
            - '5432:5432'
        volumes:
            - nao_postgres_data:/var/lib/postgresql/data
        healthcheck:
            test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-nao} -d ${POSTGRES_DB:-nao}']
            interval: 5s
            timeout: 5s
            retries: 5

    nao-init:
        image: alpine
        user: root
        volumes:
            - ${NAO_DEFAULT_PROJECT_PATH}:/context
        command: chown -R 1000:1000 /context

    nao:
        build:
            context: .
            dockerfile: Dockerfile
        ports:
            - '${SERVER_PORT:-5005}:${SERVER_PORT:-5005}'
        environment:
            # =================================================================
            # Chat Port
            # =================================================================
            SERVER_PORT: ${SERVER_PORT:-5005}

            # =================================================================
            # Authentication & API Keys
            # =================================================================
            BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET}
            BETTER_AUTH_URL: ${BETTER_AUTH_URL:-http://localhost:5005}
            OPENAI_API_KEY: ${OPENAI_API_KEY}
            ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}

            # =================================================================
            # Langfuse LLM tracing (optional)
            # =================================================================
            LANGFUSE_PUBLIC_KEY: ${LANGFUSE_PUBLIC_KEY:-}
            LANGFUSE_SECRET_KEY: ${LANGFUSE_SECRET_KEY:-}
            LANGFUSE_BASE_URL: ${LANGFUSE_BASE_URL:-}

            # =================================================================
            # Database for nao chat history
            # =================================================================
            DB_URI: postgres://${POSTGRES_USER:-nao}:${POSTGRES_PASSWORD:-nao}@postgres:5432/${POSTGRES_DB:-nao}

            # =================================================================
            # Context Configuration
            # =================================================================
            # Option A: Local mode (default) - uses bundled example or volume mount
            NAO_CONTEXT_SOURCE: local
            NAO_DEFAULT_PROJECT_PATH: /app/example

            ENABLE_USER_SIGNUP: ${ENABLE_USER_SIGNUP:-false}
        volumes:
            - ${NAO_DEFAULT_PROJECT_PATH}:/app/example
        depends_on:
            postgres:
                condition: service_started
            nao-init:
                condition: service_completed_successfully

    caddy:
        image: caddy:2-alpine
        restart: unless-stopped
        ports:
            - '80:80'
            - '443:443'
        environment:
            NAO_HOST: ${NAO_HOST}
        volumes:
            - ./Caddyfile:/etc/caddy/Caddyfile:ro
            - caddy_data:/data
            - caddy_config:/config
        depends_on:
            - nao

volumes:
    nao_postgres_data:
    caddy_data:
    caddy_config:
